
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol - Leonardy</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h2 {
            color: navy;
            font-size: 28px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: blue;
            color: white;
        }

        .btn-secondary {
            background-color: #dddddd;
        }

        .btn-outline {
            background-color: white;
            border: 2px solid rgb(30, 100, 180);
        }

        .btn-send {
            background-color: rgba(20, 140, 100, 0.9);
            color: white;
        }

        .btn-secondary,
        .btn-outline {
            color: #222222;
        }

        .btn-primary:hover {
            background-color: darkblue;
        }

        .btn-secondary:hover {
            background-color: #aaaaaa;
        }

        .btn-outline:hover {
            background-color: lightblue;
        }

        .btn-send:hover {
            background-color: darkgreen;
        }

        footer {
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <main>
        <h2>Kumpulan Tombol Leonardy</h2>

        <div class="button-group">
            <a href="../pages/gallery.html" class="btn btn-primary">Lihat Proyek</a>

            <a href="#" class="btn btn-secondary">Unduh CV</a>

            <a href="../pages/contact.html" class="btn btn-outline">Hubungi Saya</a>

            <a href="../pages/contact.html" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
