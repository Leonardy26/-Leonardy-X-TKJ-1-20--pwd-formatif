
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek - Leonardy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 50px 20px;
        }

        .card {
            position: relative;
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        .badge {
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: #e63946;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .card h2 {
            color: #222;
        }

        .card p {
            color: #555;
            line-height: 1.6;
        }

        .back-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 25px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="badge">BARU</span>

        <h2>Proyek Website Pribadi</h2>

        <p>
            Nama: Leonardy Lexhius<br>
            Kelas: X TKJ-1<br>
            Absen: 20
        </p>

        <p>
            Saya sedang belajar membuat website
            menggunakan HTML dan CSS.
        </p>
    </div>

    <a href="#" class="back-top">↑ Kembali ke Atas</a>

</body>
</html>
