        body {

            display: flex;
            min-height: 400px;
        }

        #sidebar {
            width: 25%;
            background-color: #222;
            color: white;
            padding: 20px;
        }

        #sidebar nav {
            display: flex;
            flex-direction: column;

        }

        #sidebar a {
            color: white;
            text-decoration: none;
        }

        #sidebar a:hover {
            color: orange;
        }

        .main-content {
            width: 75%;
            padding: 30px;
        }

        .main-content h1 {
            color: #222;
        }

        .main-content p {
            line-height: 1.8;
        }

        footer {
            text-align: center;
            padding: 14px;
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <div class="layout">
        <aside id="sidebar">
            <h3>Menu</h3>
            <nav>
                <a href="../index.html">Beranda</a>

                <a href="gallery.html">Proyek</a>
                <a href="contact.html">Kontak</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1>Selamat Datang di Website Leonardy</h1>
            <p>Halo, nama saya Leonardy Lexhius dari kelas X TKJ-1.</p>
            <p>Saya memiliki hobi bermain sepak bola, billiard, dan memodifikasi motor.</p>
            <p>Cita-cita saya adalah menjadi seorang pilot.</p>

    <footer>
